# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will install Deno then run `deno lint` and `deno test`.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
 push: 
   branches: [main, master]
 workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        required: true
        options: [DEV, UAT, PROD]
        default: DEV

env:
  WORKFLOW_VAR: hello-from-workflow
        
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: DEV
    outputs:
      job_output: ${{ steps.set-output.outputs.my_value }}

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        # uses: denoland/setup-deno@v1
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.x

      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # - name: Verify formatting
      #   run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Print Enviornment
        run: |
          echo "Environment: ${{github.event.inputs.environment}}"

      - name: Print some context values
        run: |
          echo "Repo: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Runner OS: ${{runner.os}}"
          echo "Runner info : ${{runner.environment}}"
          echo "Author name: ${{vars.AUTHOR_NAME}}"
          echo "SECRET: ${{secrets.MY_SECRET}}"

      - name: Conditional Step - only for master
        if: github.ref_name == 'master'
        run: echo "This only runs on main branch"

      - name: Conditional Step - only on manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: echo "Deploying to ${{inputs.environment}}"

      # - name: Set env var for later steps
      #   run: echo "DYNAMIC_VAR=computed-at-runtime" >> $GITHUB_ENV

      # - name: Use the dynamic env var
      #   run: echo "Hello $GITHUB_ENV"

      - name: Set an output
        id: set-output
        run: echo "my_value=step-output-works" >> $GITHUB_OUTPUT

      - name: Read own output
        run: echo "${{ steps.set-output.outputs.my_value }}"

      - name: Write job summary
        run: |
          echo "## Context lab results" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | ----- |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          
      # - name: Run tests
      #   run: deno test -A
